name: Verify build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install exact locked dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      - name: Game rules tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test
